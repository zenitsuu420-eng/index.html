<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* Background grid */
.container {
  width: 100%;
  height: 100%;
  background-image: linear-gradient(#eee 1px, transparent 1px),
                    linear-gradient(90deg, #eee 1px, transparent 1px);
  background-size: 40px 40px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Flowers decoration */
.flower {
  position: absolute;
  width: 100px;
  animation: float 6s infinite ease-in-out;
}

.flower.top-left { top: 20px; left: 20px; }
.flower.bottom-right { bottom: 20px; right: 20px; }

/* Main text */
.text-box {
  text-align: center;
  animation: fadeIn 2s ease-in-out;
}

h1 {
  font-size: 60px;
  font-weight: 700;
  color: black;
  animation: pop 1.5s ease;
}

p {
  font-size: 18px;
  color: #555;
  margin-top: 10px;
  animation: fadeIn 3s ease;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0px); }
}

/* Next page button */
button {
  margin-top: 30px;
  padding: 12px 25px;
  border: none;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff1e4d;
}
</style>
</head>

<body>

<div class="container">

  <!-- Decorative Images -->
  <img src="https://i.imgur.com/3ZQ3ZQp.png" class="flower top-left">
  <img src="https://i.imgur.com/3ZQ3ZQp.png" class="flower bottom-right">

  <!-- Text -->
  <div class="text-box">
    <h1>IT'S YOUR DAY..</h1>
    <p>And I made something special for you ❤️</p>

    <button onclick="nextPage()">Click Me 💖</button>
  </div>

</div>

<script>
function nextPage(){
  document.body.innerHTML = `
  <div style="
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#fff;
    font-family:Poppins;
    text-align:center;
    animation:fadeIn 2s;">
    
    <h1 style="font-size:50px;">Happy Birthday My Love 🎂</h1>
    <p style="max-width:500px;">
      You are the most special person in my life ❤️  
      Thank you for being with me always 💕  
    </p>
  </div>
  `;
}
</script>

</body>
</html>
