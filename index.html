<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultimate Surprise ❤️</title>

<style>
body {
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(-45deg,#ff4d6d,#7b2ff7,#00c9ff,#ffcc70);
  background-size:400% 400%;
  animation:bg 8s ease infinite;
  color:white;
}

@keyframes bg {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.box {
  background: rgba(0,0,0,0.6);
  padding:25px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:420px;
  box-shadow:0 0 30px rgba(255,255,255,0.3);
  animation:pop 0.8s ease;
}

@keyframes pop {
  from{transform:scale(0);}
  to{transform:scale(1);}
}

h1{font-size:26px;}
p{min-height:60px}

/* ❤️ hearts */
.heart,.meme {
  position:absolute;
  font-size:20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh) scale(0);}
  100%{transform:translateY(-10vh) scale(1.5);}
}

/* 🎆 fireworks */
.firework{
  position:absolute;
  width:6px;
  height:6px;
  background:yellow;
  border-radius:50%;
  animation:boom 1s ease-out forwards;
}

@keyframes boom{
  0%{transform:scale(1);opacity:1;}
  100%{transform:scale(15);opacity:0;}
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/02/22/audio_d1d2b2c4f3.mp3">
</audio>

<div class="box">
  <h1>🎉 Happy Birthday <span id="name"></span> ❤️</h1>
  <p id="text"></p>
</div>

<script>

let gfName = "Riya";
document.getElementById("name").innerText = gfName;

let msg = `😂 Hey ${gfName}!  
Tum meri life ka most funny + lovely glitch ho 😆❤️  
Happy Birthday jaan 🎂🔥`;

let i=0;

function typing(){
  if(i<msg.length){
    document.getElementById("text").innerHTML += msg.charAt(i);
    i++;
    setTimeout(typing,40);
  }
}

/* start everything automatically */
window.onload = () => {
  typing();
  hearts();
  memes();
  fireworksLoop();

  let music = document.getElementById("music");
  music.volume=0.7;
  music.play().catch(()=>console.log("Tap screen for music"));
}

/* ❤️ hearts */
function hearts(){
  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(Math.random()*3+3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  },300);
}

/* 😂 memes */
let memesList = [
"😂 Tum meri RAM ho… bina tumhare system hang 😆",
"🤣 Love.exe has started successfully ❤️",
"😂 Tum offline ho tab bhi dil online rehta hai",
"🤣 Warning: too much cuteness detected 💥"
];

function memes(){
  setInterval(()=>{
    let m=document.createElement("div");
    m.className="meme";
    m.innerHTML=memesList[Math.floor(Math.random()*memesList.length)];
    m.style.left=Math.random()*80+"vw";
    m.style.top=Math.random()*80+"vh";
    document.body.appendChild(m);
    setTimeout(()=>m.remove(),3000);
  },2000);
}

/* 🎆 fireworks */
function fireworksLoop(){
  setInterval(()=>{
    let f=document.createElement("div");
    f.className="firework";
    f.style.left=Math.random()*100+"vw";
    f.style.top=Math.random()*100+"vh";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1000);
  },400);
}

</script>

</body>
</html>
