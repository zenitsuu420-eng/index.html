<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>❤️ FINAL BOSS LOVE EXPERIENCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Poppins;
  overflow:hidden;
  color:white;
  background:black;
}

/* CINEMATIC VIDEO BACKGROUND */
#bgVideo{
  position:fixed;
  right:0;
  bottom:0;
  min-width:100%;
  min-height:100%;
  filter:brightness(0.35) blur(1px);
  z-index:-2;
}

/* DARK OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,rgba(0,0,0,0.2),rgba(0,0,0,0.95));
  z-index:-1;
}

/* PAGE SYSTEM */
.page{
  position:absolute;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:1s;
}
.hidden{opacity:0;pointer-events:none;transform:scale(0.95)}

h1{
  font-size:3rem;
  text-shadow:0 0 20px #ff4d6d;
}

.glow{
  color:#ff4d6d;
  text-shadow:0 0 20px #ff4d6d,0 0 50px #ff2e63;
}

button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#ff4d6d,#ff2e63);
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover{transform:scale(1.1)}

input{
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
  margin-top:10px;
}

/* HEARTS */
.heart{
  position:absolute;
  animation:float 6s linear forwards;
}
@keyframes float{
  0%{transform:translateY(100vh);opacity:1}
  100%{transform:translateY(-10vh);opacity:0}
}

/* STORY CARD */
.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(255,77,109,0.3);
  max-width:300px;
}

/* GALLERY */
.gallery img{
  width:300px;
  border-radius:15px;
  position:absolute;
  opacity:0;
  transition:1s;
  box-shadow:0 0 30px #ff4d6d;
}
.gallery img.active{
  opacity:1;
  transform:scale(1.1);
}

/* CONFETTI */
.confetti{
  position:absolute;
  width:8px;
  height:8px;
  animation:fall 4s linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-10vh)}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* MUSIC BUTTON */
#musicBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:10px 15px;
  background:#ff4d6d;
  border-radius:50px;
  cursor:pointer;
}

/* LOADER */
#loader{
  position:fixed;
  width:100%;
  height:100vh;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}
.spinner{
  width:50px;
  height:50px;
  border:4px solid #333;
  border-top:4px solid #ff4d6d;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop id="bgVideo">
  <source src="https://cdn.coverr.co/videos/coverr-love-in-the-air-8575/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<!-- LOADER -->
<div id="loader">
  <div class="spinner"></div>
  <p>Loading Love Universe...</p>
</div>

<audio id="music" autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b9b2c.mp3">
</audio>

<div id="musicBtn" onclick="toggleMusic()">🎵</div>

<!-- PAGE 1 -->
<div id="p1" class="page">
  <h1 class="glow">❤️ FINAL BOSS LOVE STORY</h1>
  <button onclick="next(1)">Start Journey</button>
</div>

<!-- PAGE 2 -->
<div id="p2" class="page hidden">
  <h1>Enter Her Name ❤️</h1>
  <input id="nameInput" placeholder="Name">
  <button onclick="setName()">Continue</button>
</div>

<!-- PAGE 3 -->
<div id="p3" class="page hidden">
  <h1 id="showName" class="glow"></h1>
  <div class="card">
    <p>You are not just a name...
    You are my universe 🌍</p>
  </div>
  <button onclick="next(3)">Next</button>
</div>

<!-- PAGE 4 -->
<div id="p4" class="page hidden">
  <h1>Memories 📸</h1>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e" class="active">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">
  </div>
  <button onclick="next(4)">Next</button>
</div>

<!-- PAGE 5 -->
<div id="p5" class="page hidden">
  <h1 class="glow">💖 FINAL EMOTION</h1>
  <p>Love is not a moment, it's eternity ✨</p>
  <button onclick="finalScene()">Reveal Ending</button>
</div>

<!-- PAGE 6 -->
<div id="p6" class="page hidden">
  <h1 class="glow">🎂 HAPPY BIRTHDAY ❤️</h1>
  <p>You are my forever story</p>
</div>

<script>
let music=document.getElementById("music");

window.onload=()=>{
  setTimeout(()=>document.getElementById("loader").style.display="none",2000);
}

function toggleMusic(){
  music.paused ? music.play() : music.pause();
}

function next(n){
  document.getElementById("p"+n).classList.add("hidden");
  document.getElementById("p"+(n+1)).classList.remove("hidden");
}

function setName(){
  let name=document.getElementById("nameInput").value;
  document.getElementById("showName").innerText="My Love " + name + " ❤️";
  next(2);
}

/* HEARTS */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},200);

/* GALLERY */
let imgs=document.querySelectorAll(".gallery img");
let idx=0;
setInterval(()=>{
  if(imgs.length){
    imgs[idx].classList.remove("active");
    idx=(idx+1)%imgs.length;
    imgs[idx].classList.add("active");
  }
},2500);

/* FINAL CONFETTI */
function finalScene(){
  next(5);
  for(let i=0;i<150;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#ff4d6d","gold","white"][Math.floor(Math.random()*3)];
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
</script>

</body>
</html>
