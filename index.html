<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Poppins;
  overflow:hidden;
  background:black;
  color:white;
}

/* Pages */
.page {
  position:absolute;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  transition:1s;
}
.hidden {opacity:0; pointer-events:none;}

h1 {
  font-size:50px;
  text-align:center;
}

.glow {
  color:#ff4d6d;
  text-shadow:0 0 20px #ff4d6d;
}

button {
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
  margin-top:20px;
}

/* input */
input {
  padding:10px;
  border-radius:10px;
  border:none;
}

/* slideshow */
.gallery img {
  width:260px;
  border-radius:20px;
  position:absolute;
  opacity:0;
  transition:1s;
}
.gallery img.active {opacity:1;}

/* hearts */
.heart {
  position:absolute;
  animation:float 5s linear infinite;
}
@keyframes float {
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}

/* fade */
.fade {
  animation:fade 2s;
}
@keyframes fade {
  from{opacity:0;}
  to{opacity:1;}
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b9b2c.mp3">
</audio>

<!-- PAGE 1 LOCK -->
<div id="p1" class="page fade">
  <h1>🔐 Enter Love Code</h1>
  <input id="pass" placeholder="Enter code">
  <button onclick="check()">Unlock ❤️</button>
</div>

<!-- PAGE 2 INTRO -->
<div id="p2" class="page hidden">
  <h1 class="glow" id="name"></h1>
  <p>Something special is waiting for you 💖</p>
  <button onclick="next(2)">Start</button>
</div>

<!-- PAGE 3 STORY -->
<div id="p3" class="page hidden">
  <h1 id="typing"></h1>
  <button onclick="next(3)">Next</button>
</div>

<!-- PAGE 4 GALLERY -->
<div id="p4" class="page hidden">
  <div class="gallery">
    <img src="https://picsum.photos/300?1" class="active">
    <img src="https://picsum.photos/300?2">
    <img src="https://picsum.photos/300?3">
  </div>
  <button onclick="next(4)">Next</button>
</div>

<!-- PAGE 5 FINAL -->
<div id="p5" class="page hidden">
  <h1>🎂 Happy Birthday ❤️</h1>
  <p>You are my world 🌍💖</p>
  <button onclick="next(5)">Final Message 💌</button>
</div>

<!-- PAGE 6 MESSAGE -->
<div id="p6" class="page hidden">
  <h1>I Love You Forever ❤️</h1>
  <p>Thank you for being in my life 💖</p>
  <button onclick="share()">Share 💬</button>
</div>

<script>
let gfName="Riya ❤️";
let password="1234";

function check(){
  if(document.getElementById("pass").value===password){
    next(1);
    document.getElementById("name").innerText=gfName;
  } else alert("Wrong 😢");
}

function next(n){
  document.getElementById("p"+n).classList.add("hidden");
  document.getElementById("p"+(n+1)).classList.remove("hidden");
}

/* typing */
let text="From strangers to everything... you became my happiness ❤️";
let i=0;
function type(){
  if(i<text.length){
    document.getElementById("typing").innerHTML+=text[i];
    i++;
    setTimeout(type,40);
  }
}
type();

/* hearts */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(20+Math.random()*30)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
},300);

/* gallery */
let imgs=document.querySelectorAll(".gallery img");
let idx=0;
setInterval(()=>{
  imgs[idx].classList.remove("active");
  idx=(idx+1)%imgs.length;
  imgs[idx].classList.add("active");
},2000);

/* share */
function share(){
  let msg="Hey ❤️ open this surprise!";
  let url=window.location.href;
  window.open("https://wa.me/?text="+encodeURIComponent(msg+" "+url));
}
</script>

</body>
</html>
