<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Poppins;
  overflow:hidden;
}

/* Pages */
.page {
  height:100vh;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:absolute;
  top:0;
  left:0;
  transition:1s;
}

/* Hidden pages */
.hidden { opacity:0; pointer-events:none; }

/* Page backgrounds */
#p1 { background:white; }
#p2 { background:#ffe6eb; }
#p3 { background:#fff0f5; }
#p4 { background:#ffe6f0; }
#p5 { background:#fff; }

/* Text */
h1 {
  font-size:60px;
  margin:0;
}

p {
  font-size:20px;
  max-width:500px;
  text-align:center;
}

/* Button */
button {
  margin-top:30px;
  padding:12px 25px;
  border:none;
  background:#ff4d6d;
  color:white;
  border-radius:25px;
  cursor:pointer;
}

/* Hearts */
.heart {
  position:absolute;
  color:red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% { transform:translateY(100vh); opacity:1;}
  100% { transform:translateY(-10vh); opacity:0;}
}

/* Typewriter */
.type {
  border-right:2px solid black;
  white-space:nowrap;
  overflow:hidden;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<!-- PAGE 1 -->
<div id="p1" class="page">
  <h1>IT'S YOUR DAY.. 🎁</h1>
  <p>So I made something special for you ❤️</p>
  <button onclick="next(1)">Start 💖</button>
</div>

<!-- PAGE 2 -->
<div id="p2" class="page hidden">
  <h1 class="type" id="typing"></h1>
  <button onclick="next(2)">Next ➡️</button>
</div>

<!-- PAGE 3 -->
<div id="p3" class="page hidden">
  <h1>You are my everything 💕</h1>
  <p>Every moment with you is special 💖</p>
  <button onclick="next(3)">Next ➡️</button>
</div>

<!-- PAGE 4 -->
<div id="p4" class="page hidden">
  <h1>I Love You ❤️</h1>
  <p>Forever & Always 💫</p>
  <button onclick="next(4)">Final Surprise 🎂</button>
</div>

<!-- PAGE 5 -->
<div id="p5" class="page hidden">
  <h1>🎂 Happy Birthday My Love 🎂</h1>
  <p>Stay happy, keep smiling, I love you forever ❤️</p>
</div>

<script>
function next(n){
  document.getElementById("p"+n).classList.add("hidden");
  document.getElementById("p"+(n+1)).classList.remove("hidden");
}

/* TYPEWRITER */
let text = "From the day you came into my life... everything changed ❤️";
let i = 0;
function type(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(type,50);
  }
}
type();

/* HEARTS */
setInterval(()=>{
  let heart = document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*100+"vw";
  heart.innerHTML="❤️";
  heart.style.fontSize=(20+Math.random()*30)+"px";
  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),5000);
},300);
</script>

</body>
</html>
