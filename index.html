<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Special Wish ❤️</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: black;
  color:white;
  text-align:center;
  overflow:hidden;
}

/* Loader */
#loader {
  position: fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
}

/* Main hidden */
#main {
  display:none;
}

/* Heart animation */
.heart {
  position:absolute;
  color:red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform:translateY(100vh);}
  100% {transform:translateY(-10vh);}
}

img {
  width:250px;
  border-radius:20px;
  margin-top:20px;
}

button {
  padding:12px 20px;
  border:none;
  border-radius:20px;
  background:red;
  color:white;
  margin-top:20px;
}
</style>
</head>

<body>

<div id="loader">Loading Surprise... ❤️</div>

<div id="main">
  <h1>Happy Birthday 🎂</h1>
  <h2>Riya 💖</h2>
  <img src="https://i.imgur.com/6VBx3io.png">

  <p>You are my everything ❤️</p>

  <button onclick="start()">Click Me 🎁</button>
</div>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-love.mp3"></audio>

<script>
setTimeout(()=>{
  document.getElementById("loader").style.display="none";
  document.getElementById("main").style.display="block";
},2000);

function start(){
  document.getElementById("music").play();
  alert("I Love You ❤️");

  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);

    setTimeout(()=>h.remove(),5000);
  },300);
}
</script>

</body>
</html>
